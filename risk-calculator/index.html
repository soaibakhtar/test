<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GoldX Risk Calculator</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body data-page="risk"><div id="page-content"><section><div class="card risk-card"><div class="form-grid"><label>Account balance<input id="balance" type="number" value="5000"></label><label>Risk %<input id="riskPct" type="number" step="0.1" value="1"></label><label>Entry<input id="rEntry" type="number" step="0.01" placeholder="e.g. 4040"></label><label>Stop loss<input id="rSl" type="number" step="0.01" placeholder="e.g. 4030"></label><label>Dollar value / point<input id="pointValue" type="number" step="0.01" value="1"></label></div><button class="primary" onclick="calculateRisk()">Calculate</button><div id="riskResult" class="risk-result">Enter entry and SL to calculate position risk.</div></div></section></div><script src="/page-shell.js?v=20260818-2"></script><script src="/risk-page.js?v=20260818-1"></script></body></html>
